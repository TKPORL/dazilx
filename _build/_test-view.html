<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>view</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<script>
  var q0 = location.search;
  var theme = q0.indexOf('light') >= 0 ? 'light' : 'dark';
  localStorage.setItem('dazi.theme', JSON.stringify(theme));
</script>
<iframe id="f" src="../index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var f = document.getElementById('f');
  var q = location.search;
  var m = (q.match(/mode=(\w+)/) || [])[1] || 'char';
  var seq = (q.match(/keys=([a-z]+)/) || [])[1] || '';
  setTimeout(function () {
    var btn = f.contentDocument.querySelector('.mode[data-mode="' + m + '"]');
    if (btn) btn.click();
    if (seq) {
      var i = 0;
      var t = setInterval(function () {
        if (i >= seq.length) { clearInterval(t); return; }
        f.contentDocument.dispatchEvent(new KeyboardEvent('keydown', { key: seq[i++], bubbles: true, cancelable: true }));
      }, 45);
    }
  }, 250);
});
</script>
</body>
</html>
