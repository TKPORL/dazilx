<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>diag</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
</head><body>
<iframe id="f" src="../index.html"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var f = document.getElementById('f');
  var q = location.search;
  if (q.indexOf('article') >= 0) {
    f.contentDocument.querySelector('.mode[data-mode="article"]').click();
  }
  setTimeout(function () {
    var d = f.contentDocument;
    var L = d.querySelector('.lines');
    var U = d.querySelector('.u');
    var P = d.querySelector('.paper');
    var W = d.querySelector('.w');
    var rows = {};
    d.querySelectorAll('.u').forEach(function (e) {
      rows[Math.round(e.getBoundingClientRect().top)] = 1;
    });
    var out = {
      paperW: Math.round(P.getBoundingClientRect().width),
      linesW: Math.round(L.getBoundingClientRect().width),
      linesMaxW: getComputedStyle(L).maxWidth,
      linesDisplay: getComputedStyle(L).display,
      linesWrap: getComputedStyle(L).flexWrap,
      uW: Math.round(U.getBoundingClientRect().width),
      uMinW: getComputedStyle(U).minWidth,
      wW: W ? Math.round(W.getBoundingClientRect().width) : -1,
      wDisplay: W ? getComputedStyle(W).display : '-',
      units: d.querySelectorAll('.u').length,
      rows: Object.keys(rows).length,
      scrollW: L.scrollWidth
    };
    document.title = 'DIAG ' + JSON.stringify(out);
  }, 500);
});
</script>
</body></html>
